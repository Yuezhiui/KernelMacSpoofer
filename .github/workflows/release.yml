name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      - name: Read and validate release version
        shell: pwsh
        run: |
          [xml]$project = Get-Content MacSpoof/MacSpoof/MacSpoof.csproj
          $version = [string]($project.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1)
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'Project version is missing' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag does not match project version' }
          "MACSPOOF_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Validate MAC handling
        run: dotnet run --project tests/MacSpoof.Checks
      - name: Publish standalone app
        run: dotnet publish MacSpoof/MacSpoof/MacSpoof.csproj -c Release -p:Platform=x64 -p:PublishProfile=win-x64 -o MacSpoof_Fixed
      - name: Sign portable executable if configured
        shell: pwsh
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          $hasPfx = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_PFX_BASE64)
          $hasPassword = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_PFX_PASSWORD)

          if (-not $hasPfx -and -not $hasPassword) {
            "MACSPOOF_SIGNING_ENABLED=false" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "MACSPOOF_SIGNING_STATUS=Unsigned - signing secrets are not configured" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            Write-Warning 'Authenticode signing secrets are not configured. Release artifacts will be unsigned.'
            exit 0
          }
          if (-not $hasPfx -or -not $hasPassword) {
            throw 'Authenticode signing is partially configured. Set both WINDOWS_SIGNING_PFX_BASE64 and WINDOWS_SIGNING_PFX_PASSWORD, or remove both.'
          }

          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue |
            Sort-Object { [version]$_.Directory.Parent.Name } -Descending |
            Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe was not found on the Windows runner' }

          $pfxPath = Join-Path $env:RUNNER_TEMP 'macspoof-signing.pfx'
          try {
            $pfxBytes = [Convert]::FromBase64String(($env:WINDOWS_SIGNING_PFX_BASE64 -replace '\s', ''))
            [IO.File]::WriteAllBytes($pfxPath, $pfxBytes)
            & $signtool.FullName sign /fd SHA256 /f $pfxPath /p $env:WINDOWS_SIGNING_PFX_PASSWORD /tr http://timestamp.digicert.com /td SHA256 MacSpoof_Fixed/MacSpoof.exe
            if ($LASTEXITCODE -ne 0) { throw 'Signing MacSpoof.exe failed' }
            & $signtool.FullName verify /pa MacSpoof_Fixed/MacSpoof.exe
            if ($LASTEXITCODE -ne 0) { throw 'Authenticode verification failed for MacSpoof.exe' }
          }
          finally {
            Remove-Item -LiteralPath $pfxPath -Force -ErrorAction SilentlyContinue
          }

          "MACSPOOF_SIGNING_ENABLED=true" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MACSPOOF_SIGNING_STATUS=Authenticode signed" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build installer and portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null

          @(
            '# Third-Party Notices'
            ''
            '## Google Material Symbols'
            ''
            'The SVG icon assets under `MacSpoof/MacSpoof/Assets/material-*.svg` are derived from Google Material Symbols obtained from Google Fonts.'
            ''
            '- Source: https://fonts.google.com/icons'
            '- Documentation: https://developers.google.com/fonts/docs/material_symbols'
            '- License: Apache License 2.0'
            ''
            'The Material Symbols artwork remains subject to its original Apache 2.0 license.'
            "MacSpoof's own source code remains licensed under the repository's MIT License by Koshi."
          ) | Set-Content artifacts/THIRD_PARTY_NOTICES.md -Encoding utf8

          $portableDir = Join-Path $env:RUNNER_TEMP "MacSpoof-portable-$env:GITHUB_RUN_ID"
          New-Item -ItemType Directory -Path $portableDir -Force | Out-Null
          Copy-Item 'MacSpoof_Fixed/*' -Destination $portableDir -Recurse
          Copy-Item 'LICENSE', 'artifacts/THIRD_PARTY_NOTICES.md' -Destination $portableDir
          Compress-Archive -Path "$portableDir/*" -DestinationPath "artifacts/MacSpoof-v$env:MACSPOOF_VERSION-Portable-x64.zip" -Force

          # Generate the installer definition only on the CI runner. No .iss file is kept in the repository.
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) { throw 'Inno Setup 6 is missing from the runner' }

          $sourceDir = (Resolve-Path 'MacSpoof_Fixed').Path
          $iconFile = (Resolve-Path 'MacSpoof/MacSpoof/Assets/MacIcon.ico').Path
          $licenseFile = (Resolve-Path 'LICENSE').Path
          $noticeFile = (Resolve-Path 'artifacts/THIRD_PARTY_NOTICES.md').Path
          $outputDir = (Resolve-Path 'artifacts').Path
          $issPath = Join-Path $env:RUNNER_TEMP 'MacSpoof-release.iss'

          @"
          [Setup]
          AppId=KernelMacSpoofer
          AppName=MacSpoof
          AppVersion=$env:MACSPOOF_VERSION
          AppPublisher=Koshi
          AppPublisherURL=https://github.com/Yuezhiui/KernelMacSpoofer
          AppSupportURL=https://github.com/Yuezhiui/KernelMacSpoofer/issues
          AppUpdatesURL=https://github.com/Yuezhiui/KernelMacSpoofer/releases
          DefaultDirName={autopf}\MacSpoof
          DefaultGroupName=MacSpoof
          UninstallDisplayName=MacSpoof
          UninstallDisplayIcon={app}\MacSpoof.exe
          SetupIconFile=$iconFile
          LicenseFile=$licenseFile
          Compression=lzma2
          SolidCompression=yes
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          MinVersion=10.0.17763
          OutputDir=$outputDir
          OutputBaseFilename=MacSpoof-Setup-v$env:MACSPOOF_VERSION-x64
          PrivilegesRequired=admin
          WizardStyle=modern
          CloseApplications=yes
          RestartApplications=no
          VersionInfoCompany=Koshi
          VersionInfoDescription=MacSpoof - Windows MAC address manager
          VersionInfoProductName=MacSpoof
          VersionInfoProductVersion=$env:MACSPOOF_VERSION

          [Files]
          Source: "$sourceDir\*"; DestDir: "{app}"; Excludes: "*.pdb"; Flags: ignoreversion recursesubdirs createallsubdirs
          Source: "$licenseFile"; DestDir: "{app}"; Flags: ignoreversion
          Source: "$noticeFile"; DestDir: "{app}"; Flags: ignoreversion

          [Icons]
          Name: "{group}\MacSpoof"; Filename: "{app}\MacSpoof.exe"
          Name: "{autodesktop}\MacSpoof"; Filename: "{app}\MacSpoof.exe"; Tasks: desktopicon

          [Tasks]
          Name: "desktopicon"; Description: "{cm:CreateDesktopIcon}"; GroupDescription: "{cm:AdditionalIcons}"; Flags: unchecked
          "@ | Set-Content -LiteralPath $issPath -Encoding utf8

          & $compiler $issPath
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
      - name: Sign installer if configured
        shell: pwsh
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          if ($env:MACSPOOF_SIGNING_ENABLED -ne 'true') {
            Write-Warning 'Installer remains unsigned because Authenticode signing secrets are not configured.'
            exit 0
          }

          $installer = "artifacts/MacSpoof-Setup-v$env:MACSPOOF_VERSION-x64.exe"
          if (-not (Test-Path -LiteralPath $installer)) { throw "Installer not found: $installer" }
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue |
            Sort-Object { [version]$_.Directory.Parent.Name } -Descending |
            Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe was not found on the Windows runner' }

          $pfxPath = Join-Path $env:RUNNER_TEMP 'macspoof-signing.pfx'
          try {
            $pfxBytes = [Convert]::FromBase64String(($env:WINDOWS_SIGNING_PFX_BASE64 -replace '\s', ''))
            [IO.File]::WriteAllBytes($pfxPath, $pfxBytes)
            & $signtool.FullName sign /fd SHA256 /f $pfxPath /p $env:WINDOWS_SIGNING_PFX_PASSWORD /tr http://timestamp.digicert.com /td SHA256 $installer
            if ($LASTEXITCODE -ne 0) { throw 'Signing the installer failed' }
            & $signtool.FullName verify /pa $installer
            if ($LASTEXITCODE -ne 0) { throw 'Authenticode verification failed for the installer' }
          }
          finally {
            Remove-Item -LiteralPath $pfxPath -Force -ErrorAction SilentlyContinue
          }
      - name: Generate checksums and signing report
        shell: pwsh
        run: |
          $releaseFiles = @(
            "artifacts/MacSpoof-v$env:MACSPOOF_VERSION-Portable-x64.zip",
            "artifacts/MacSpoof-Setup-v$env:MACSPOOF_VERSION-x64.exe"
          )
          foreach ($file in $releaseFiles) {
            if (-not (Test-Path -LiteralPath $file)) { throw "Release artifact not found: $file" }
          }
          $releaseFiles | ForEach-Object {
            $hash = Get-FileHash -LiteralPath $_ -Algorithm SHA256
            "$($hash.Hash.ToLower())  $(Split-Path $hash.Path -Leaf)"
          } | Set-Content artifacts/SHA256SUMS.txt -Encoding ascii

          if ($env:MACSPOOF_SIGNING_ENABLED -eq 'true') {
            $status = 'Authenticode signed'
            $detail = 'MacSpoof.exe and the Windows installer were Authenticode signed before checksums were generated.'
          } else {
            $status = 'Unsigned'
            $detail = 'Signing secrets were not configured, so this release was built without Authenticode signatures.'
          }

          @(
            '### MacSpoof release signing'
            "- Status: **$status**"
            "- $detail"
            '- SHA-256 checksums: `SHA256SUMS.txt`'
          ) | Add-Content -Path $env:GITHUB_STEP_SUMMARY

          @(
            '## MacSpoof v' + $env:MACSPOOF_VERSION
            ''
            'Updated the sketch-style interface to match the approved proportions more closely, including larger full-width action controls and the new official red-and-black MacSpoof logo across the app and Windows branding.'
            ''
            '### Build integrity'
            ''
            "**Authenticode signing:** $status"
            ''
            "$detail Verify downloads with SHA256SUMS.txt included in this release."
          ) | Set-Content release-signing-note.md -Encoding utf8
      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MacSpoof-windows-x64
          path: |
            artifacts/MacSpoof-v*-Portable-x64.zip
            artifacts/MacSpoof-Setup-v*-x64.exe
            artifacts/SHA256SUMS.txt
            artifacts/THIRD_PARTY_NOTICES.md
      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            artifacts/MacSpoof-v*-Portable-x64.zip
            artifacts/MacSpoof-Setup-v*-x64.exe
            artifacts/SHA256SUMS.txt
            artifacts/THIRD_PARTY_NOTICES.md
          body_path: release-signing-note.md
          draft: false
          prerelease: false
          generate_release_notes: true
