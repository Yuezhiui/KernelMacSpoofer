name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore and Publish Standalone Executable
        run: |
          dotnet publish MacSpoof/MacSpoof/MacSpoof.csproj -c Release -p:Platform=x64 -p:PublishProfile=win-x64

      - name: Package Portable ZIP
        run: |
          Compress-Archive -Path "MacSpoof/MacSpoof/bin/Release/net8.0-windows10.0.19041.0/win-x64/publish/*" -DestinationPath "KernelMacSpoofer-v1.0.0-Portable-x64.zip" -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            KernelMacSpoofer-v1.0.0-Portable-x64.zip
          draft: false
          prerelease: false
          generate_release_notes: true
