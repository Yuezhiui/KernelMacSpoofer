name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Validate MAC handling
        run: dotnet run --project tests/MacSpoof.Checks
      - name: Publish standalone app
        run: dotnet publish MacSpoof/MacSpoof/MacSpoof.csproj -c Release -p:Platform=x64 -p:PublishProfile=win-x64 -o MacSpoof_Fixed
      - name: Build installer and portable ZIP
        shell: pwsh
        run: |
          [xml]$project = Get-Content MacSpoof/MacSpoof/MacSpoof.csproj
          $version = [string]($project.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1)
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag does not match project version' }
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) { throw 'Inno Setup 6 is missing from the runner' }
          & $compiler "/DAppVersion=$version" installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
          Compress-Archive -Path 'MacSpoof_Fixed/*' -DestinationPath "artifacts/KernelMacSpoofer-v$version-Portable-x64.zip"
          Get-ChildItem artifacts -File | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content artifacts/SHA256SUMS.txt
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KernelMacSpoofer-windows-x64
          path: artifacts/*
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: artifacts/*
          draft: false
          prerelease: false
          generate_release_notes: true
